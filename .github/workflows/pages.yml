name: Deploy dashboard

# Publishes dashboard/ to GitHub Pages (Settings > Pages > Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths: ["dashboard/**"]
  # Commits pushed by the data workflow's GITHUB_TOKEN do not trigger `push`,
  # so redeploy whenever that workflow finishes successfully.
  workflow_run:
    workflows: ["Update data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest commit, including the data update
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
