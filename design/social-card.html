<!doctype html>
<!-- Source of dashboard/social.png, the 1200x630 link-preview image. The tiles are the ISO codes of the 28 states covered. Regenerate with:
     chrome --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=dashboard/social.png design/social-card.html
     The mark is the same drawing as dashboard/favicon.svg; keep them in step. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f5f0e6;color:#1f1a14;font-family:Mukta,sans-serif;position:relative}
.band{position:absolute;left:0;right:0;top:0;height:22px;background:
 conic-gradient(from 135deg at 50% 0,#f2b544 90deg,transparent 0) 0 0/32px 16px repeat-x,
 linear-gradient(#0e6e6e,#0e6e6e) 0 100%/100% 5px no-repeat}
.band.b{top:auto;bottom:0;transform:scaleY(-1)}
.wrap{position:absolute;left:84px;right:84px;top:92px}
svg{width:120px;height:120px;display:block}
h1{font-size:76px;line-height:1.02;font-weight:700;margin:34px 0 18px;letter-spacing:-0.01em}
p{font-size:32px;line-height:1.3;margin:0;color:#4a4238;max-width:900px}
.codes{position:absolute;left:84px;bottom:56px;display:grid;grid-template-columns:repeat(14,56px);gap:8px}
.codes span{height:38px;display:grid;place-items:center;background:#e3f1ef;color:#0e6e6e;font-weight:700;font-size:18px;border-radius:5px;letter-spacing:.04em}
</style></head><body>
<div class="band"></div>
<div class="wrap"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0e6e6e"/><circle cx="16" cy="16" r="10" fill="none" stroke="#fffdf8" stroke-width="1.5" stroke-opacity="0.9"/><g stroke="#fffdf8" stroke-width="1.2" stroke-opacity="0.75"><line x1="16" y1="16" x2="16" y2="6"/><line x1="16" y1="16" x2="23.07" y2="8.93"/><line x1="16" y1="16" x2="26" y2="16"/><line x1="16" y1="16" x2="23.07" y2="23.07"/><line x1="16" y1="16" x2="16" y2="26"/><line x1="16" y1="16" x2="8.93" y2="23.07"/><line x1="16" y1="16" x2="6" y2="16"/><line x1="16" y1="16" x2="8.93" y2="8.93"/></g><g fill="#fffdf8"><circle cx="16" cy="6" r="1.9"/><circle cx="23.07" cy="8.93" r="1.9"/><circle cx="26" cy="16" r="1.9"/><circle cx="23.07" cy="23.07" r="1.9"/><circle cx="16" cy="26" r="1.9"/><circle cx="8.93" cy="23.07" r="1.9"/><circle cx="6" cy="16" r="1.9"/><circle cx="8.93" cy="8.93" r="1.9"/></g><circle cx="16" cy="16" r="3.6" fill="#f2b544"/></svg>
